name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps

      - name: Migrate a fresh database
        run: |
          rm -f deployctl.db
          python -m alembic upgrade head
          python -m alembic upgrade head
          python -m alembic current | grep -q "002"
          python - <<'PY'
          import sqlite3

          with sqlite3.connect("deployctl.db") as conn:
              tables = {
                  row[0]
                  for row in conn.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }

          expected = {"alembic_version", "deployments", "readiness"}
          missing = expected - tables
          assert not missing, f"missing tables: {sorted(missing)}"
          print("migrated tables:", sorted(tables))
          PY
          rm -f deployctl.db

      - name: Ruff
        run: ruff check deployctl tests

      - name: Format check
        run: ruff format --check deployctl tests

      - name: Pytest
        run: pytest -q
