[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployctl"
version = "0.1.0"
description = "Deployment control plane skeleton"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn==0.51.0",
    "sqlalchemy[asyncio]==2.1.6",
    "alembic==1.20.1",
    "aiosqlite==0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["deployctl*"]

[tool.pytest.ini_options]
testpaths = ["deployctl"]
pythonpath = ["."]
